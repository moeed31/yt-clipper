name: Weekly Top Twitch Clips Compilation

on:
  schedule:
    - cron: '0 12 * * SUN' # Runs automatically every Sunday at 12:00 PM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_weekly_compilation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Configure Git for State Tracking
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Esports Automator Bot"

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" requests pillow google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Weekly Compilation Pipeline
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 twitch_weekly_compilation.py

      - name: Commit Processed Compilation Records
        if: always()
        run: |
          git add processed_compilation_clips.txt 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: update processed compilation records [skip ci]" && git push)
