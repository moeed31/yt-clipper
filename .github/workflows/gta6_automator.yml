name: GTA 6 AI-Optimized Automator

on:
  schedule:
    # Shorts: 2x daily at peak engagement windows (replaces 4-hour spam cadence)
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
    # Daily 16:9 Compilation: 1x daily at 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Select pipeline to run manually"
        required: true
        default: "shorts"
        type: choice
        options:
          - shorts
          - compilation

permissions:
  contents: write

concurrency:
  group: gta6-automator
  cancel-in-progress: false

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg & DejaVu fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet \
            google-genai \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            faster-whisper \
            edge-tts \
            yt-dlp \
            requests \
            Pillow

      - name: Configure Git for state & Instagram staging commits
        run: |
          git config user.name "TRG Automator"
          git config user.email "actions@github.com"

      - name: Run GTA 6 Shorts Automator
        if: >
          (github.event_name == 'schedule' && (github.event.schedule == '0 12 * * *' || github.event.schedule == '0 20 * * *')) ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'shorts')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python gta6_giants_automator.py

      - name: Run GTA 6 Daily Compilation Automator
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *') ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'compilation')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python gta6_daily_compilation.py

      - name: Commit and push updated state files
        run: |
          git pull --rebase origin "${{ github.ref_name }}" || true
          git add processed_gta6_clips.txt processed_gta6_comp_clips.txt 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update GTA 6 processed clip state"
            git push origin "${{ github.ref_name }}"
          fi
