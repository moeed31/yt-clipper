name: 9-Game Tournament Clipper & Shorts Automator

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Select Esport Channel (or auto to scan all 9)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - valorant
          - cs2
          - pubgm
          - pubgpc
          - apex
          - r6
          - cod
          - tekken
          - fortnite
      vod_url:
        description: 'Optional: Paste specific VOD URL (leave blank to auto-fetch)'
        required: false
        default: ''
      shorts_count:
        description: 'Number of Shorts to clip & post'
        required: false
        default: '2'

  # Runs automatically at 12:00 PM UTC (5:00 PM PKT) every day
  schedule:
    - cron: '0 12 * * *'

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure processed_vods.txt exists
        run: touch processed_vods.txt

      - name: Install FFmpeg & Bold Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -U yt-dlp Pillow faster-whisper google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run 9-Game Clipping Pipeline
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          GAME="${{ github.event.inputs.game || 'auto' }}"
          VOD_URL="${{ github.event.inputs.vod_url || '' }}"
          SHORTS="${{ github.event.inputs.shorts_count || '2' }}"
          if [ -n "$VOD_URL" ]; then
            python pipeline.py --game "$GAME" --url "$VOD_URL" --shorts-count "$SHORTS" --upload
          else
            python pipeline.py --game "$GAME" --shorts-count "$SHORTS" --upload
          fi

      - name: Save Processed VOD ID to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add processed_vods.txt
          git diff --staged --quiet || (git commit -m "chore: mark tournament VOD as processed [skip ci]" && git push)
