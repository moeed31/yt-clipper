name: 9-Game Tournament Clipper & Multi-Platform Automator

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Select Esport Channel (or auto to scan all 9)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - valorant
          - cs2
          - pubgm
          - pubgpc
          - apex
          - r6
          - cod
          - tekken
          - fortnite
      vod_url:
        description: 'Optional: Paste specific VOD URL (leave blank to auto-fetch)'
        required: false
        default: ''
      shorts_count:
        description: 'Number of Shorts/Reels/TikToks to clip & post'
        required: false
        default: '2'

  # Runs automatically at 12:00 PM UTC (5:00 PM PKT) every day
  schedule:
    - cron: '0 12 * * *'

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure processed_vods.txt exists
        run: touch processed_vods.txt

      - name: Install Deno (Required by yt-dlp for YouTube JS Challenge)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start YouTube BotGuard PO-Token Server
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 3

      - name: Install FFmpeg & Bold Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Multi-Platform SDKs
        run: |
          pip install -U "yt-dlp[default,curl-cffi]" yt-dlp-ejs bgutil-ytdlp-pot-provider Pillow faster-whisper google-api-python-client google-auth-oauthlib google-auth-httplib2 requests google-genai

      - name: Run 9-Game Multi-Platform Pipeline
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          GAME="${{ github.event.inputs.game || 'auto' }}"
          VOD_URL="${{ github.event.inputs.vod_url || '' }}"
          SHORTS="${{ github.event.inputs.shorts_count || '2' }}"
          if [ -n "$VOD_URL" ]; then
            python pipeline.py --game "$GAME" --url "$VOD_URL" --shorts-count "$SHORTS" --upload
          else
            python pipeline.py --game "$GAME" --shorts-count "$SHORTS" --upload
          fi

      - name: Save Processed VOD ID to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add processed_vods.txt
          git diff --staged --quiet || (git commit -m "chore: mark tournament VOD as processed [skip ci]" && git push)
