name: Multi-Game Esports Tournament Automator

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch:
    inputs:
      target_game:
        description: 'Select Target Game (or leave on auto for rotation)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - valorant
          - apex
          - cs2
          - pubg
          - fortnite
          - r6
          - cod
          - tekken
          - lol
      custom_vod_url:
        description: 'Optional: Custom YouTube VOD URL to process'
        required: false
        default: ''
        type: string
      shorts_count:
        description: 'Number of 9:16 Vertical Shorts to generate'
        required: false
        default: '2'
        type: string

concurrency:
  group: repo-git-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run_esports_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Deno & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core unzip curl
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Start YouTube PO-Token Provider (bgutil-ytdlp-pot-provider)
        run: |
          docker run -d -p 4416:4416 --name pot-provider brainicism/bgutil-ytdlp-pot-provider
          sleep 5

      - name: Configure Git for Instagram Staging & State Tracking
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Esports Automator Bot"

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider
          pip install faster-whisper requests numpy pillow google-genai
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Write YouTube Cookies (If Provided)
        env:
          YT_COOKIES_RAW: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES_RAW" ]; then
            printf "%s\n" "$YT_COOKIES_RAW" > cookies.txt
            echo "[+] cookies.txt written ($(wc -c < cookies.txt) bytes)"
          else
            echo "[*] No YT_COOKIES secret found; relying on PO-Token provider."
          fi

      - name: Execute Multi-Platform Tournament Pipeline
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TARGET_GAME: ${{ inputs.target_game || 'auto' }}
          CUSTOM_VOD_URL: ${{ inputs.custom_vod_url || '' }}
          SHORTS_COUNT: ${{ inputs.shorts_count || '2' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python3 pipeline.py

      - name: Clean Up Temporary IG Files & Commit Processed VODs
        if: always()
        run: |
          rm -rf ig_stage/ cookies.txt
          git add -A ig_stage/ processed_vods.txt playlists.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update processed VODs and clean staging [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X ours origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
              sleep 5
            done
          fi
