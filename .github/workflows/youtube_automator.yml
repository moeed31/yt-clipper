name: 9-Game Tournament Clipper & Multi-Platform Automator

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch:
    inputs:
      game:
        description: 'Select Game (or auto to rotate all 9 games)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - valorant
          - apex
          - cs2
          - pubg
          - fortnite
          - r6
          - cod
          - tekken
          - lol
      vod_url:
        description: 'Optional: Specific YouTube VOD URL (leave blank for auto-search)'
        required: false
        default: ''
      shorts_count:
        description: 'Number of Shorts/Reels/TikToks to generate (1-3)'
        required: true
        default: '2'

permissions:
  contents: write

jobs:
  clip_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, Fonts, ImageMagick, Deno, Docker)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core imagemagick curl unzip
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Start YouTube PO-Token Provider Server (Bypass Bot Check)
        run: |
          docker run -d --name bgutil-pot -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          sleep 5

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install "yt-dlp[default,curl-cffi]" yt-dlp-ejs bgutil-ytdlp-pot-provider
          pip install faster-whisper numpy pillow requests google-genai
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Prepare Netscape YouTube Cookies (Auto-Repair Formatting)
        env:
          RAW_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          python3 -c '
          import os
          raw = os.environ.get("RAW_COOKIES", "").strip()
          if raw:
              lines = ["#" + " Netscape HTTP Cookie File"]
              for line in raw.splitlines():
                  s = line.strip()
                  if not s or s.startswith("#"):
                      continue
                  parts = s.split("\t") if "\t" in s else s.split()
                  if len(parts) >= 7:
                      domain = parts[0]
                      flag = "TRUE" if domain.startswith(".") else "FALSE"
                      path = parts[2]
                      secure = parts[3].upper() if parts[3].upper() in ("TRUE", "FALSE") else "TRUE"
                      expiry = parts[4] if parts[4].isdigit() else "1893456000"
                      name = parts[5]
                      val = parts[6]
                      lines.append(f"{domain}\t{flag}\t{path}\t{secure}\t{expiry}\t{name}\t{val}")
              with open("cookies.txt", "w", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
              print(f"[+] Wrote {len(lines)-1} repaired cookies to cookies.txt")
          '

      - name: Run Multi-Platform Esports Pipeline
        env:
          TARGET_GAME: ${{ github.event.inputs.game || 'auto' }}
          CUSTOM_VOD_URL: ${{ github.event.inputs.vod_url || '' }}
          SHORTS_COUNT: ${{ github.event.inputs.shorts_count || '2' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY || 'sbawdctpohczr9bgiv' }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET || '2e5DenQpSuXqO4w1pHtnFwnqyv8A0V17' }}
        run: |
          python3 pipeline.py

      - name: Commit Updated State (processed_vods.txt & playlists.json)
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Esports Automator Bot"
          git add processed_vods.txt playlists.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: update processed VODs and playlist cache [skip ci]" && git push)
